<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Platform Downloader</title>
  <link rel="icon" href="https://res.cloudinary.com/dwiozm4vz/image/upload/v1776039396/zhvrvx8p8kurkv3rmnyn.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Logo di atas -->
    <div class="logo-container">

    <h1>All Platform Downloader</h1>

    <div class="platform-selector">
      <button class="platform-btn" onclick="showPlatform('all')">All Platform Downloader</button>
    </div>

    <!-- Downloader Section -->
    <div class="download-section" id="download-section">
      <h3>Enter URL</h3>
      <div class="input-container">
        <input type="text" id="url" placeholder="Enter URL for download All Url Media">
      </div>
      <button class="download-btn" onclick="fetchMedia()">Download All</button>
      <div class="loading-spinner" id="loading-spinner"></div> <!-- Loading Spinner -->
    </div>

    <!-- Result Section -->
    <div class="result" id="result" style="display: none;">
      <h3>Pratinjau Media</h3>
      <div id="media-preview"></div>
      <div class="download-buttons">
        <button id="download-video-btn" onclick="autoDownload('video')" disabled>Download Video</button>
        <button id="download-music-btn" onclick="autoDownload('music')" disabled>Download Music</button>
        <button id="download-image-btn" onclick="autoDownload('image')" disabled>Download Image</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Made with ❤️ by <a href="https://tiktok.com/@ben.mister.ben" target="_blank">RizkyMaxz</a></p>
    <p>© 2026 Social Media Downloader. All rights reserved.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
