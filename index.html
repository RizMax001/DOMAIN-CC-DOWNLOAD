<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Platform Downloader</title>
  <link rel="icon" href="https://res.cloudinary.com/dwiozm4vz/image/upload/v1775908954/vkcajf0yvjokd5rbioo0.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>All Platform Downloader</h1>

    <div class="platform-selector">
      <button class="platform-btn" onclick="showPlatform('all')">Download All Platform</button>
    </div>

    <div class="download-section" id="download-section">
      <h3>Masukkan URL</h3>
      <div class="input-container">
        <input type="text" id="url" placeholder="Masukkan URL untuk download">
      </div>
      <button class="download-btn" onclick="fetchMedia()">Download All</button>
      <div class="loading-spinner" id="loading-spinner"></div>
    </div>

    <div class="result" id="result" style="display: none;">
      <h3>Pratinjau Media</h3>
      <div id="media-preview">
        <img src="https://via.placeholder.com/640x360.png" alt="Media Preview" class="media-thumbnail">
      </div>
      <div id="media-details">
        <!-- Additional media details such as social media name, caption, and duration -->
      </div>
      <div class="download-buttons">
        <button id="download-video-btn" onclick="autoDownload('video')" disabled>Download Video</button>
        <button id="download-music-btn" onclick="autoDownload('music')" disabled>Download Music</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Made with ❤️ by <a href="https://tiktok.com/@ben.mister.ben" target="_blank">RizkyMaxz</a></p>
    <p>© 2026 Social Media Downloader. All rights reserved.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
